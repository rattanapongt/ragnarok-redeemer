<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO Gift Code Redeemer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
  h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f8b400; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; margin: 0 auto 16px; }
  .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 16px; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
  textarea, select, input[type=number] {
    width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
    color: #e2e8f0; font-size: 13px; font-family: monospace; padding: 8px 10px; resize: vertical;
  }
  textarea:focus, select:focus, input:focus { outline: none; border-color: #f8b400; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; max-width: 900px; margin: 0 auto 16px; }
  .stat { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: #f8b400; }
  .stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }
  .progress { height: 4px; background: #2d3148; border-radius: 2px; max-width: 900px; margin: 0 auto 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: #f8b400; border-radius: 2px; transition: width .3s; width: 0%; }
  .btn-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto 16px; }
  button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #btn-start { background: #f8b400; color: #0f1117; }
  #btn-stop { background: #e53e3e; color: #fff; display: none; }
  .log-box { max-width: 900px; margin: 0 auto; background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 12px; max-height: 380px; overflow-y: auto; }
  .log-line { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid #2d3148; font-size: 12px; font-family: monospace; }
  .log-line:last-child { border-bottom: none; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 700; flex-shrink: 0; min-width: 60px; text-align: center; }
  .ok    { background: #1a3a2a; color: #4ade80; }
  .skip  { background: #2a2a1a; color: #facc15; }
  .fail  { background: #3a1a1a; color: #f87171; }
  .captcha { background: #2a1a3a; color: #c084fc; }
  .error { background: #3a1a1a; color: #f87171; }
  .idle  { color: #64748b; text-align: center; padding: 20px; font-size: 13px; }
</style>
</head>
<body>

<h1>⚔ RO Eternal Love — Gift Code Redeemer</h1>

<div class="stats">
  <div class="stat"><div class="stat-num" id="s-ids">0</div><div class="stat-label">IDs</div></div>
  <div class="stat"><div class="stat-num" id="s-codes">0</div><div class="stat-label">Codes</div></div>
  <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">ทั้งหมด</div></div>
  <div class="stat"><div class="stat-num" id="s-success">0</div><div class="stat-label">สำเร็จ</div></div>
</div>

<div class="grid">
  <div class="card">
    <label>Player IDs (1 บรรทัด = 1 ID)</label>
    <textarea id="ids" rows="10" placeholder="4295016633&#10;4295016634&#10;..."></textarea>
  </div>
  <div class="card">
    <label>Gift Codes (1 บรรทัด = 1 code)</label>
    <textarea id="codes" rows="10" placeholder="WZGPTFWW&#10;ABCD1234&#10;..."></textarea>
  </div>
</div>

<div class="card" style="max-width:900px;margin:0 auto 16px;">
  <div class="row2">
    <div>
      <label>Server</label>
      <select id="server">
        <option value="90001">Memory of Faith (90001)</option>
        <option value="90002">90002</option>
        <option value="90003">90003</option>
      </select>
    </div>
    <div>
      <label>Delay ระหว่าง request (วินาที)</label>
      <input type="number" id="delay" value="3" min="1" max="30">
    </div>
  </div>
</div>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<div class="btn-row">
  <button id="btn-start" onclick="startJob()">เริ่มเติม code</button>
  <button id="btn-stop" onclick="stopJob()">หยุด</button>
</div>

<div class="log-box" id="log">
  <div class="idle">กรอก IDs และ Codes แล้วกดเริ่ม</div>
</div>

<script>
let jobId = null;
let pollTimer = null;
let lastLogCount = 0;

function getLines(id) {
  return document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
}

function updateStats() {
  const ids = getLines('ids');
  const codes = getLines('codes');
  document.getElementById('s-ids').textContent = ids.length;
  document.getElementById('s-codes').textContent = codes.length;
  document.getElementById('s-total').textContent = ids.length * codes.length;
}

document.getElementById('ids').addEventListener('input', updateStats);
document.getElementById('codes').addEventListener('input', updateStats);

async function startJob() {
  const ids = getLines('ids');
  const codes = getLines('codes');
  if (!ids.length || !codes.length) return alert('กรุณาใส่ ID และ Code ก่อน');

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').style.display = 'block';
  document.getElementById('log').innerHTML = '';
  document.getElementById('s-success').textContent = '0';
  document.getElementById('progress').style.width = '0%';
  lastLogCount = 0;

  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      server_id: document.getElementById('server').value,
      player_ids: ids,
      codes: codes,
      delay: parseInt(document.getElementById('delay').value),
    })
  });
  const data = await res.json();
  jobId = data.job_id;
  pollTimer = setInterval(poll, 1500);
}

async function stopJob() {
  if (jobId) await fetch('/api/stop/' + jobId, { method: 'POST' });
  clearInterval(pollTimer);
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').style.display = 'none';
}

async function poll() {
  if (!jobId) return;
  const res = await fetch('/api/status/' + jobId);
  const data = await res.json();

  document.getElementById('s-success').textContent = data.success;
  const pct = data.total ? Math.round((data.done / data.total) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';

  const log = document.getElementById('log');
  const newLogs = data.logs.slice(lastLogCount);
  newLogs.forEach(entry => {
    lastLogCount++;
    const line = document.createElement('div');
    line.className = 'log-line';

    const badge = document.createElement('span');
    badge.className = 'badge ' + entry.status;
    badge.textContent = {ok:'สำเร็จ', skip:'ซ้ำ', fail:'ล้มเหลว', captcha:'captcha', error:'error'}[entry.status] || entry.status;

    const txt = document.createElement('span');
    txt.style.color = '#94a3b8';
    txt.textContent = `[${entry.index}] ID ${entry.pid} + ${entry.code} | ocr=${entry.captcha} | ${entry.msg}`;

    line.appendChild(badge);
    line.appendChild(txt);
    log.appendChild(line);
  });
  log.scrollTop = log.scrollHeight;

  if (data.status === 'done' || data.status === 'stopped') {
    clearInterval(pollTimer);
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').style.display = 'none';

    const fin = document.createElement('div');
    fin.className = 'idle';
    fin.textContent = `เสร็จสิ้น: ${data.success}/${data.done} สำเร็จ`;
    log.appendChild(fin);
  }
}
</script>
</body>
</html>
