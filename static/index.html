<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO Gift Code Redeemer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
  h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f8b400; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; margin: 0 auto 16px; }
  .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 16px; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
  textarea, select, input[type=number] {
    width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
    color: #e2e8f0; font-size: 13px; font-family: monospace; padding: 8px 10px; resize: vertical;
  }
  textarea:focus, select:focus, input:focus { outline: none; border-color: #f8b400; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; max-width: 900px; margin: 0 auto 16px; }
  .stat { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: #f8b400; }
  .stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }
  .progress { height: 4px; background: #2d3148; border-radius: 2px; max-width: 900px; margin: 0 auto 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: #f8b400; border-radius: 2px; transition: width .3s; width: 0%; }
  .btn-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto 16px; }
  button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #btn-start { background: #f8b400; color: #0f1117; }
  #btn-stop { background: #e53e3e; color: #fff; display: none; }
  .log-box { max-width: 900px; margin: 0 auto; background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 12px; max-height: 380px; overflow-y: auto; }
  .log-line { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid #2d3148; font-size: 12px; font-family: monospace; }
  .log-line:last-child { border-bottom: none; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 700; flex-shrink: 0; min-width: 60px; text-align: center; }
  .ok    { background: #1a3a2a; color: #4ade80; }
  .skip  { background: #2a2a1a; color: #facc15; }
  .fail  { background: #3a1a1a; color: #f87171; }
  .captcha { background: #2a1a3a; color: #c084fc; }
  .error { background: #3a1a1a; color: #f87171; }
  .idle  { color: #64748b; text-align: center; padding: 20px; font-size: 13px; }
  #fail-summary { max-width: 900px; margin: 16px auto 0; background: #1a1d27; border: 1px solid #e53e3e; border-radius: 12px; padding: 14px; }
  .fail-head { color: #f87171; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .fail-list { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 10px; font-size: 12px; color: #e2e8f0; white-space: pre; overflow-x: auto; max-height: 240px; overflow-y: auto; }
  .copy-btn { margin-top: 10px; width: 100%; padding: 10px; background: #2d3148; color: #e2e8f0; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .copy-btn:hover { background: #3a3f5a; }
  #pid-summary { max-width: 900px; margin: 16px auto 0; }
  .pid-title { font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
  .pid-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 12px; }
  .pid-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; padding: 12px; }
  .pid-card.has-fail { border-color: #e53e3e; }
  .pid-head { display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 13px; color: #f8b400; margin-bottom: 8px; }
  .pid-head .cnt { font-size: 11px; color: #64748b; }
  .code-row { display: flex; align-items: center; gap: 6px; font-family: monospace; font-size: 12px; padding: 3px 0; }
  .code-row .mark { flex-shrink: 0; width: 16px; text-align: center; }
  .code-row.ok   .code { color: #4ade80; }
  .code-row.skip .code { color: #facc15; }
  .code-row.fail .code { color: #f87171; }
  .code-row.active { background: #1e2a44; border-radius: 4px; }
  .code-row.active .code { color: #60a5fa; }
  .code-row.active .mark { animation: pulse 1s ease-in-out infinite; }
  .code-row.pending .mark, .code-row.pending .code { color: #475569; }
  .code-row .note { font-size: 11px; color: #64748b; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  #wait-banner { max-width: 900px; margin: 0 auto 16px; background: #2a2410; border: 1px solid #f8b400; color: #facc15; border-radius: 8px; padding: 10px 14px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<h1>⚔ RO Eternal Love — Gift Code Redeemer</h1>

<div class="stats">
  <div class="stat"><div class="stat-num" id="s-ids">0</div><div class="stat-label">IDs</div></div>
  <div class="stat"><div class="stat-num" id="s-codes">0</div><div class="stat-label">Codes</div></div>
  <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">ทั้งหมด</div></div>
  <div class="stat"><div class="stat-num" id="s-success">0</div><div class="stat-label">สำเร็จ</div></div>
</div>

<div class="grid">
  <div class="card">
    <label>Player IDs (1 บรรทัด = 1 ID)</label>
    <textarea id="ids" rows="10" placeholder="4295016633&#10;4295016634&#10;..."></textarea>
  </div>
  <div class="card">
    <label>Gift Codes (1 บรรทัด = 1 code)</label>
    <textarea id="codes" rows="10" placeholder="WZGPTFWW&#10;ABCD1234&#10;..."></textarea>
  </div>
</div>

<div class="card" style="max-width:900px;margin:0 auto 16px;">
  <div class="row2">
    <div>
      <label>Server</label>
      <select id="server">
        <option value="90002003">Memory of Faith</option>
        <option value="90001">Eternal Love</option>
        <option value="90002">Midnight Party</option>
      </select>
    </div>
    <div>
      <label>Delay ระหว่าง request</label>
      <input type="text" value="3 วินาที (กำหนดโดยระบบ)" disabled
             style="opacity:.6; cursor:not-allowed;">
    </div>
  </div>
</div>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<div id="wait-banner" style="display:none;"></div>

<div class="btn-row">
  <button id="btn-start" onclick="startJob()">เริ่มเติม code</button>
  <button id="btn-stop" onclick="stopJob()">หยุด</button>
</div>

<div class="log-box" id="log">
  <div class="idle">กรอก IDs และ Codes แล้วกดเริ่ม</div>
</div>

<div id="pid-summary" style="display:none;"></div>

<div id="fail-summary" style="display:none;"></div>

<script>
let jobId = null;
let pollTimer = null;
let lastLogCount = 0;
let pollErrors = 0;
let curIds = [];
let curCodes = [];

function stopPolling() {
  clearTimeout(pollTimer);
  pollTimer = null;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').style.display = 'none';
}

function setWaitBanner(msg) {
  const b = document.getElementById('wait-banner');
  b.textContent = '⏳ ' + msg;
  b.style.display = 'block';
}
function clearWaitBanner() {
  document.getElementById('wait-banner').style.display = 'none';
}

// เจอ 502/503/เน็ตสะดุด → ไม่ยอมแพ้ รอแบบ backoff แล้ว poll ต่อ (ลดถี่ลงเพื่อลดโหลดเซิร์ฟเวอร์)
function waitAndReschedule(msg) {
  pollErrors++;
  const wait = Math.min(3000 + pollErrors * 1500, 15000);
  setWaitBanner(`${msg} (รออัตโนมัติ ${Math.round(wait / 1000)}s แล้วลองใหม่)`);
  pollTimer = setTimeout(poll, wait);
}

function getLines(id) {
  return document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
}

function updateStats() {
  const ids = getLines('ids');
  const codes = getLines('codes');
  document.getElementById('s-ids').textContent = ids.length;
  document.getElementById('s-codes').textContent = codes.length;
  document.getElementById('s-total').textContent = ids.length * codes.length;
}

document.getElementById('ids').addEventListener('input', updateStats);
document.getElementById('codes').addEventListener('input', updateStats);

async function startJob() {
  const ids = getLines('ids');
  const codes = getLines('codes');
  if (!ids.length || !codes.length) return alert('กรุณาใส่ ID และ Code ก่อน');

  curIds = ids;
  curCodes = codes;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').style.display = 'block';
  document.getElementById('log').innerHTML = '';
  const fs = document.getElementById('fail-summary');
  fs.style.display = 'none'; fs.innerHTML = '';
  const ps = document.getElementById('pid-summary');
  ps.style.display = 'none'; ps.innerHTML = '';
  document.getElementById('s-success').textContent = '0';
  document.getElementById('progress').style.width = '0%';
  lastLogCount = 0;

  // วาดการ์ดต่อ Player ID ทันที (ทุก code เริ่มที่สถานะ "รอคิว")
  renderLiveCards({ by_pid: {}, active: [] });

  let res, data;
  try {
    res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        server_id: document.getElementById('server').value,
        player_ids: ids,
        codes: codes,
      })
    });
    data = await res.json();          // 502/หน้า error ส่ง body ว่าง → กันไม่ให้ crash
  } catch (e) {
    stopPolling();
    return alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (เซิร์ฟเวอร์อาจกำลังตื่นหรือล่ม)\nรอสัก 30–60 วิ แล้วลองใหม่');
  }
  if (!res.ok || !data || !data.job_id) {
    stopPolling();
    return alert((data && data.error) || `เริ่มงานไม่สำเร็จ (HTTP ${res.status})`);
  }
  jobId = data.job_id;
  pollErrors = 0;
  clearWaitBanner();
  pollTimer = setTimeout(poll, 800);
}

async function stopJob() {
  if (jobId) await fetch('/api/stop/' + jobId, { method: 'POST' });
  stopPolling();
}

async function poll() {
  if (!jobId) return;

  let res, data;
  try {
    res = await fetch('/api/status/' + jobId);
  } catch (e) {
    return waitAndReschedule('เชื่อมต่อสะดุด');   // เน็ตสะดุด → รอแล้วลองใหม่
  }

  if (res.status === 404) {                        // job หายจริง (เซิร์ฟเวอร์ restart)
    stopPolling();
    setWaitBanner('งานหาย (เซิร์ฟเวอร์อาจ restart) — กด "เริ่มเติม code" ใหม่อีกครั้ง');
    return;
  }
  if (!res.ok) {                                   // 502/503 = เซิร์ฟเวอร์แน่น → ไม่ยอมแพ้ รอคิว
    return waitAndReschedule(`เซิร์ฟเวอร์แน่น (${res.status}) กำลังรอคิว`);
  }
  try {
    data = await res.json();
  } catch (e) {
    return waitAndReschedule('กำลังรอเซิร์ฟเวอร์');
  }
  if (!data || !Array.isArray(data.logs)) {
    return waitAndReschedule('กำลังรอเซิร์ฟเวอร์');
  }

  // ได้ข้อมูลปกติ → รีเซ็ตตัวนับ error + ซ่อน banner
  pollErrors = 0;
  clearWaitBanner();

  document.getElementById('s-success').textContent = data.success;
  const pct = data.total ? Math.round((data.done / data.total) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';

  // อัปเดตการ์ดต่อ Player ID แบบสด ทุกครั้งที่ poll
  renderLiveCards(data);

  const log = document.getElementById('log');
  const newLogs = data.logs.slice(lastLogCount);
  newLogs.forEach(entry => {
    lastLogCount++;
    const line = document.createElement('div');
    line.className = 'log-line';

    const badge = document.createElement('span');
    badge.className = 'badge ' + entry.status;
    badge.textContent = {ok:'สำเร็จ', skip:'ซ้ำ', fail:'ล้มเหลว', captcha:'captcha', error:'error'}[entry.status] || entry.status;

    const txt = document.createElement('span');
    txt.style.color = '#94a3b8';
    txt.textContent = `[${entry.index}] ID ${entry.pid} + ${entry.code} | ocr=${entry.captcha} | ${entry.msg}`;

    line.appendChild(badge);
    line.appendChild(txt);
    log.appendChild(line);
  });
  log.scrollTop = log.scrollHeight;

  if (data.status === 'done' || data.status === 'stopped') {
    stopPolling();

    const fin = document.createElement('div');
    fin.className = 'idle';
    fin.textContent = `เสร็จสิ้น: ${data.success}/${data.done} สำเร็จ`;
    log.appendChild(fin);

    renderFailSummary(data.failed || []);
    return;
  }

  // ยังไม่เสร็จ → นัด poll รอบถัดไป
  pollTimer = setTimeout(poll, 1500);
}

// การ์ดต่อ Player ID (อัปเดตสด): แต่ละ code = ✓สำเร็จ / ≡ซ้ำ / ✗ไม่ผ่าน / ⏳กำลังเติม / รอคิว
function renderLiveCards(data) {
  const box = document.getElementById('pid-summary');
  if (!curIds.length) { box.style.display = 'none'; box.innerHTML = ''; return; }

  const byPid = data.by_pid || {};
  // เซ็ตของคู่ที่ "กำลังเติม" ตอนนี้ (pid|code)
  const activeSet = new Set((data.active || []).map(a => a.pid + '|' + a.code));

  const meta = {
    ok:      { mark: '✓', cls: 'ok',      note: '' },
    skip:    { mark: '≡', cls: 'skip',    note: 'ซ้ำ' },
    fail:    { mark: '✗', cls: 'fail',    note: '' },
    active:  { mark: '⏳', cls: 'active',  note: 'กำลังเติม…' },
    pending: { mark: '•', cls: 'pending', note: 'รอคิว' },
  };

  const cards = curIds.map(pid => {
    const b = byPid[pid] || { ok: [], skip: [], fail: [] };
    const okSet   = new Set(b.ok   || []);
    const skipSet = new Set(b.skip || []);
    const failSet = new Set(b.fail || []);

    const rows = curCodes.map(code => {
      let st;
      if (okSet.has(code)) st = 'ok';
      else if (skipSet.has(code)) st = 'skip';
      else if (failSet.has(code)) st = 'fail';
      else if (activeSet.has(pid + '|' + code)) st = 'active';
      else st = 'pending';
      const m = meta[st];
      return `<div class="code-row ${m.cls}"><span class="mark">${m.mark}</span>` +
             `<span class="code">${code}</span>` +
             (m.note ? ` <span class="note">${m.note}</span>` : '') + `</div>`;
    });

    const okN = (b.ok || []).length;
    const skipN = (b.skip || []).length;
    const failN = (b.fail || []).length;
    const doneN = okN + skipN + failN;
    return `<div class="pid-card${failN ? ' has-fail' : ''}">
      <div class="pid-head"><span>ID ${pid}</span>` +
      `<span class="cnt">${doneN}/${curCodes.length} · ✓${okN} ✗${failN}</span></div>
      ${rows.join('')}
    </div>`;
  });

  box.style.display = 'block';
  box.innerHTML = `<div class="pid-title">📋 สถานะตาม Player ID</div><div class="pid-grid">${cards.join('')}</div>`;
}

// สรุป ID + code ที่ "ไม่ผ่าน" (fail / captcha / error) เพื่อเอาไปเติมเองในเกม
function renderFailSummary(failed) {
  const box = document.getElementById('fail-summary');

  if (!failed.length) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  const lines = failed.map(e => `${e.pid}\t${e.code}\t(${e.status})`);
  const copyText = failed.map(e => `${e.pid}  ${e.code}`).join('\n');

  box.style.display = 'block';
  box.innerHTML =
    `<div class="fail-head">⚠ ไม่ผ่าน ${failed.length} รายการ — เอาไปเติมเองในเกม</div>` +
    `<pre class="fail-list">ID\tCODE\tสถานะ\n${lines.join('\n')}</pre>` +
    `<button class="copy-btn" id="copy-fail">คัดลอก ID + Code ที่ไม่ผ่าน</button>`;

  document.getElementById('copy-fail').onclick = () => {
    navigator.clipboard.writeText(copyText).then(() => {
      document.getElementById('copy-fail').textContent = 'คัดลอกแล้ว ✓';
    });
  };
}
</script>
</body>
</html>
